# Manor Ledger — nginx site.
#
# Listens on loopback only: the public entry point is a Cloudflare Tunnel
# (cloudflared on this host) that terminates TLS at the edge and connects to
# 127.0.0.1:8090. Nothing here is reachable from the internet directly, and no
# port has to be opened on the cloud firewall.

# Login brute-force brake, in addition to the application's own throttle.
limit_req_zone $binary_remote_addr zone=manor_login:1m rate=10r/m;

# Requests arrive from cloudflared on loopback; the visitor's address is in
# CF-Connecting-IP. Trusting that header from anywhere else would let a client
# spoof its IP, so it is honoured for loopback only.
map $http_cf_connecting_ip $manor_client_ip {
    default $remote_addr;
    ~. $http_cf_connecting_ip;
}

server {
    listen 127.0.0.1:8090;
    server_name manor.handgivers.it;

    root /opt/manor-ledger/public;
    index index.php;

    set_real_ip_from 127.0.0.1;
    real_ip_header CF-Connecting-IP;

    server_tokens off;
    client_max_body_size 16k;
    client_body_timeout 10s;
    client_header_timeout 10s;

    access_log /var/log/nginx/manor-ledger.access.log combined;
    error_log  /var/log/nginx/manor-ledger.error.log warn;

    # Static assets: immutable, cache-busted by ?v=<mtime> from the app.
    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header X-Content-Type-Options nosniff always;
    }

    location = /robots.txt { try_files $uri =404; }
    location = /favicon.ico { return 204; }

    # Never serve dotfiles or anything that is not the front controller.
    location ~ /\. { deny all; }
    location ~ \.php$ { return 404; }

    location = /login {
        limit_req zone=manor_login burst=5 nodelay;
        limit_req_status 429;
        try_files /index.php =404;
        include /etc/nginx/snippets/manor-ledger-fastcgi.conf;
    }

    location / {
        try_files /index.php =404;
        include /etc/nginx/snippets/manor-ledger-fastcgi.conf;
    }
}

# Anything that reaches this port with a different Host header is dropped
# without a response (444). cloudflared only routes the configured hostname,
# so this catches local misconfiguration and scanners.
server {
    listen 127.0.0.1:8090 default_server;
    server_name _;
    return 444;
}
