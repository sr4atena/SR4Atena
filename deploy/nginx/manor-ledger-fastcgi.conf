# Shared FastCGI parameters for the Manor Ledger front controller.
fastcgi_pass unix:/run/php/manor-ledger.sock;
fastcgi_index index.php;
include fastcgi_params;
fastcgi_param SCRIPT_FILENAME /opt/manor-ledger/public/index.php;
fastcgi_param HTTPS on;               # TLS is terminated by Cloudflare
fastcgi_param REMOTE_ADDR $remote_addr;
fastcgi_hide_header X-Powered-By;
fastcgi_read_timeout 30s;
