# /etc/ssh/sshd_config.d/70-manor-hardening.conf
# Applied by deploy/install.sh after `sshd -t` validates the merged config.
# Key-only access is already enforced by the cloud image; this tightens the rest.
PermitRootLogin no
MaxAuthTries 3
LoginGraceTime 30
X11Forwarding no
AllowAgentForwarding no
ClientAliveInterval 300
ClientAliveCountMax 2
