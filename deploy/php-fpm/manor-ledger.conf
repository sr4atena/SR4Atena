; Manor Ledger — dedicated php-fpm pool.
; Runs as its own unprivileged user so the web process can read the built
; dashboard and write sessions, and nothing else. The Roblox key is NOT
; available to this pool: only the refresh job (systemd) sees it.
[manor-ledger]
user = manor
group = manor
listen = /run/php/manor-ledger.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; 1 GB VM shared with other services: spawn workers only when needed.
pm = ondemand
pm.max_children = 4
pm.process_idle_timeout = 30s
pm.max_requests = 500
request_terminate_timeout = 30s

clear_env = yes
env[MANOR_DATA_DIR] = /var/lib/manor-ledger
; Written by this pool only; the data directory above is read-only for it.
env[MANOR_STATE_DIR] = /var/lib/manor-ledger/web
env[MANOR_HOST] = manor.handgivers.it

php_admin_flag[expose_php] = off
php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
php_admin_value[error_log] = /var/log/php/manor-ledger.log
php_admin_flag[allow_url_fopen] = off
php_admin_flag[allow_url_include] = off
php_admin_value[open_basedir] = /opt/manor-ledger:/var/lib/manor-ledger:/tmp
php_admin_value[disable_functions] = exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec
php_admin_value[memory_limit] = 64M
php_admin_value[post_max_size] = 16K
php_admin_value[upload_max_filesize] = 1K
php_admin_flag[file_uploads] = off
php_admin_value[max_execution_time] = 20
php_admin_value[session.save_path] = /var/lib/manor-ledger/web/sessions
php_admin_flag[session.use_strict_mode] = on
php_admin_flag[session.use_only_cookies] = on
php_admin_flag[session.cookie_httponly] = on
php_admin_flag[session.cookie_secure] = on
php_admin_value[session.cookie_samesite] = Strict
php_admin_value[session.gc_maxlifetime] = 43200
php_admin_value[session.sid_length] = 48
php_admin_value[session.sid_bits_per_character] = 6
